name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

      - name: Build CLI bundle
        run: node scripts/build-cli.mjs

      - name: Smoke test before release (no LLM)
        run: node scripts/test-ci.mjs

      - name: Build kernel binary (ubuntu)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
      - name: Build codex-tui
        working-directory: kernel/codex-rs
        run: cargo build --release -p codex-tui
      - name: Stage kernel binary into bundle
        run: |
          mkdir -p release/kernel
          cp kernel/codex-rs/target/release/codex-tui release/kernel/openzcode-linux-x64
          chmod +x release/kernel/openzcode-linux-x64

      - name: Package release bundle
        run: node scripts/package-release.mjs
        env:
          OPENZCODE_RELEASE_TAG: ${{ github.ref_name }}

      - name: Package marketplace plugins
        run: |
          mkdir -p release/mkt
          for d in marketplace/plugins/*/; do
            name=$(basename "$d")
            (cd marketplace/plugins && zip -qr "$OLDPWD/release/mkt/plugin-$name.zip" "$name")
            echo "packed plugin-$name.zip"
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.zip
            release/mkt/*.zip
          generate_release_notes: true
